# SPDX-License-Identifier: GPL-3.0-only
#
# The repository's own checks: that the toolkit copy and the shared code are exactly what their sync
# scripts recorded, that no game data has been committed, and that every shell script is executable.
# The port is not built here: building it needs a ROM set, which CI has none of, so releases are made by
# hand (tools/release/README.md).
name: check
on: [push, pull_request, workflow_dispatch]
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The toolkit copy and the shared code are untouched
        run: make check-toolkit check-common
      - name: No ROM set, key or save state is committed
        run: |
          if git ls-files | grep -qiE '(^|/)rom/|\.(zip|key)$|(^|/)state[0-9]*\.bin$'; then
            echo "::error::a ROM set, key or save state is tracked:"
            git ls-files | grep -iE '(^|/)rom/|\.(zip|key)$|(^|/)state[0-9]*\.bin$'
            exit 1
          fi
          echo "ok: no game data is tracked"
      - name: Every tracked shell script is executable
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            if [ "$(git ls-files -s -- "$f" | cut -d' ' -f1)" != "100755" ]; then
              echo "::error file=$f::not mode 100755 (Windows git does not record the executable bit)"
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "ok: every shell script is 100755"
          exit "$bad"
