# Darkstalkers: The Night Warriors (Capcom 1994, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Darkstalkers
# What the window is called (the name stays the folder the player's settings are kept under)
title = Darkstalkers Recomp
id = dstlk
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.dstlk
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `dstlk` is MAME's parent set (Euro 940705); its clones (dstlku, dstlka, dstlkh, dstlkj, ...) are built
# from it.
rom_set = dstlk
rom_parent = dstlk
rom_name = Darkstalkers: The Night Warriors (Euro 940705)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side by side
# per row (64-bit words); the four 4 MiB files make the first 16 MiB of the board's graphics region and
# the four 1 MiB files (14m/16m/18m/20m) the last 4 MiB. sound_program: the Z80's ROMs. samples: the
# QSound chip's (vam.11m, vam.12m, 4 MiB). key: the board's cipher key.
program = vame.03a:004c9cff vame.04a:ae413ff2 vame.05a:60678756 vame.06a:912870b3 vame.07a:dabae3e8 vame.08a:2c6e3077 vame.09a:f16db74b vame.10a:701e2147
graphics = vam.13m:c51baf99 vam.15m:3ce83c77 vam.17m:4f2408e0 vam.19m:9ff60250 vam.14m:bd87243c vam.16m:afec855f vam.18m:3a033625 vam.20m:2bff6a89
sound_program = vam.01:64b685d5 vam.02:cf7c97c7
samples = vam.11m:4a39deb2 vam.12m:1a3e5c03
key = dstlk.key:cfa46dec

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program. Lower it once the code
# is known to end sooner.
code_end = 400000
